    <!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>대시보드</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="dashboard">

    <aside class="sidebar">
        <div class="logo">Nexon</div>

        <ul>
            <li class="active"><a href="/">대시보드</a></li>
            <li><a href="/sales">매출 관리</a></li>
            <li><a href="/product">상품 관리</a></li>
            <li><a href="/customer">고객 관리</a></li>
            <li><a href="/notice">공지사항</a></li>
        </ul>
    </aside>

    <main class="main">

        <header class="top">
            <h2>대시보드</h2>
            <div>admin 👤</div>
        </header>

        <section class="summary">
            <div class="summary-card">총 회원수<br><strong>1,245</strong></div>
            <div class="summary-card">총 매출<br><strong>₩12,500,000</strong></div>
            <div class="summary-card">신규 회원<br><strong>312</strong></div>
            <div class="summary-card">상품 수<br><strong>125</strong></div>
        </section>

        <section class="content-grid">

            <div class="box wide">
                <h3>월별 매출 통계</h3>
                <canvas id="lineChart"></canvas>
            </div>

            <div class="box">
                <h3>카테고리 비율</h3>
                <canvas id="doughnutChart"></canvas>
            </div>

            <div class="box wide">
                <h3>연령별 회원 현황</h3>
                <canvas id="barChart"></canvas>
            </div>

            <div class="box">
                <h3>접속 기기 비율</h3>
                <canvas id="pieChart"></canvas>
            </div>

        </section>

    </main>

</div>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
